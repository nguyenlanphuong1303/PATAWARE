<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PATAWARE Shield</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 w-80 p-4 font-sans select-none border border-slate-800">
    <!-- Header -->
    <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-md shadow-cyan-500/20">
                <i class="fa-solid fa-shield-halved text-white text-sm"></i>
            </div>
            <div>
                <span class="text-sm font-extrabold tracking-tight bg-gradient-to-r from-cyan-400 to-blue-400 bg-clip-text text-transparent">PATAWARE</span>
                <span class="text-[9px] block text-cyan-400 font-semibold tracking-wider">SHIELD & PARENTAL</span>
            </div>
        </div>

        <!-- Toggle Realtime Shield -->
        <label class="relative inline-flex items-center cursor-pointer" title="Bật/Tắt bảo vệ thời gian thực">
            <input type="checkbox" id="shieldToggle" class="sr-only peer" checked>
            <div class="w-9 h-5 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-cyan-500"></div>
        </label>
    </div>

    <!-- Live Tab Status -->
    <div class="mt-3 bg-slate-900 border border-slate-800 rounded-xl p-3">
        <div class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold mb-1 flex items-center justify-between">
            <span>Trang hiện tại:</span>
            <span id="tabStatusBadge" class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-800 text-slate-400">Đang kiểm tra...</span>
        </div>
        <div id="currentTabDomain" class="font-mono text-xs font-bold text-slate-200 truncate">...</div>

        <div class="mt-2.5 pt-2 border-t border-slate-800/80 flex items-center justify-between text-xs">
            <span class="text-slate-400 text-[11px]">Chỉ số rủi ro:</span>
            <span id="currentTabScore" class="font-extrabold text-slate-300">-</span>
        </div>
    </div>

    <!-- Toggle Chế độ Bảo vệ Trẻ em (Parental Control) -->
    <div class="mt-3 bg-slate-900/60 border border-slate-800/80 rounded-xl p-2.5 flex items-center justify-between">
        <div class="flex items-center space-x-2 text-xs">
            <i class="fa-solid fa-child-reaching text-cyan-400 text-base"></i>
            <div>
                <span class="block text-slate-200 font-semibold text-[11px]">Bảo Vệ Trẻ Em (Parental)</span>
                <span class="block text-[9px] text-slate-400">Chặn web cờ bạc, cá độ & 18+</span>
            </div>
        </div>
        <label class="relative inline-flex items-center cursor-pointer" title="Bật/Tắt chặn cờ bạc & 18+">
            <input type="checkbox" id="parentalToggle" class="sr-only peer" checked>
            <div class="w-8 h-4 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-cyan-500"></div>
        </label>
    </div>

    <!-- Thống kê chặn lừa đảo -->
    <div class="mt-2.5 bg-slate-900/60 border border-slate-800/80 rounded-xl p-2.5 flex items-center justify-between">
        <div class="flex items-center space-x-2 text-xs text-slate-300">
            <i class="fa-solid fa-shield-virus text-rose-500 text-sm"></i>
            <span class="text-[11px]">Mối đe dọa đã chặn:</span>
        </div>
        <span id="blockedCountDisplay" class="font-extrabold text-xs text-cyan-400">0</span>
    </div>

    <!-- Quick Actions -->
    <div class="mt-3 space-y-2">
        <button id="btnOpenDashboard" class="w-full py-2.5 px-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold text-xs flex items-center justify-center space-x-2 transition-all shadow-md shadow-cyan-500/20">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Mở Nền Tảng Quét Đa Tầng</span>
        </button>

        <button id="btnReportCurrent" class="w-full py-2 px-3 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 text-xs font-medium flex items-center justify-center space-x-2 transition-colors">
            <i class="fa-solid fa-flag text-rose-400"></i>
            <span>Báo Cáo Trang Web Này</span>
        </button>
    </div>

    <!-- Footer -->
    <div class="mt-3 pt-2 text-center text-[10px] text-slate-500 border-t border-slate-900">
        Anti-Scam & Parental Control • Pataware Engine
    </div>

    <script src="popup.js"></script>
</body>
</html>
