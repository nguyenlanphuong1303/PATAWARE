services:
  # 1. Cơ sở dữ liệu PostgreSQL chuẩn Production
  db:
    image: postgres:16-alpine
    container_name: pataware_postgres
    restart: always
    environment:
      POSTGRES_USER: pataware_user
      POSTGRES_PASSWORD: pataware_secure_password
      POSTGRES_DB: pataware_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pataware_user -d pataware_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Ứng dụng Pataware FastAPI Web App
  web:
    build: .
    container_name: pataware_web
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://pataware_user:pataware_secure_password@db:5432/pataware_db
      - APP_ENV=production
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
    env_file:
      - .env

volumes:
  postgres_data:
